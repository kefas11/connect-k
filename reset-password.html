<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Connect-K</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

  <a class="brand auth-brand" href="/">
    <span class="brand-mark">K</span>
    <span>
      <b>CONNECT-<i>K</i></b>
      <small>Made easy.</small>
    </span>
  </a>

  <main class="auth-shell single-auth">

    <section class="auth-card">

      <p class="eyebrow">SECURE YOUR ACCOUNT</p>

      <h2>Choose a new password</h2>

      <form id="reset-form">

        <label for="password">New password</label>
        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button class="btn btn-red btn-full" type="submit">
          Save new password
        </button>

        <p class="form-message" id="form-message" role="status"></p>

      </form>

    </section>

  </main>

  <script type="module" src="js/reset-password.js"></script>

</body>
</html>
